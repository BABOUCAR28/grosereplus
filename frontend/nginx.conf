server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Redirige les appels API vers le service backend (réseau Docker interne
    # gp-suite-network, résolu par son nom de service). Permet d'accéder au
    # site directement via ce conteneur (ex. port 5173 exposé en debug) sans
    # dépendre du reverse-proxy nginx/ — les deux points d'entrée fonctionnent
    # alors de façon identique.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api-docs/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # Fichiers publics remplaçables par l'admin (logo, brochure, photos) —
    # même correction que dans nginx/default.conf : sans ce bloc, /uploads/...
    # tombe dans le "location /" ci-dessous (try_files), qui ne trouve rien
    # sur le disque de CE conteneur et replie sur index.html au lieu du
    # fichier réel, hébergé sur le conteneur backend.
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sert un fichier statique s'il existe (y compris les pages pré-rendues,
    # ex. /a-propos/index.html), sinon un dossier du même nom, sinon replie
    # sur le shell SPA (index.html) pour que le routage côté client
    # (React Router) prenne le relais — indispensable pour que les liens
    # directs vers une route interne (ex. /tableau-de-bord) ne renvoient pas
    # une 404 côté serveur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
