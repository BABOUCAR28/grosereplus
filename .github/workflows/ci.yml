name: GP-SUITE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend — Lint, migrations, tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: gp_suite_test
          MYSQL_USER: gp_user_test
          MYSQL_PASSWORD: gp_password_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Vérifier la syntaxe de tous les fichiers JS
        run: |
          find src migrations seeders tests -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Préparer le fichier d'environnement de test
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=gp_suite_test/' .env
          sed -i 's/^DB_USER=.*/DB_USER=gp_user_test/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=gp_password_test/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_test_secret_key_minimum_32_characters/' .env
          sed -i 's/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=ci_test_refresh_secret_key_32_chars/' .env

      - name: Attendre la disponibilité de MySQL
        run: |
          for i in {1..15}; do
            mysqladmin ping -h127.0.0.1 -P3306 -ugp_user_test -pgp_password_test && break
            echo "En attente de MySQL... ($i)"
            sleep 3
          done

      - name: Appliquer les migrations Sequelize (valide le schéma sur un vrai MySQL)
        env:
          NODE_ENV: development
        run: npx sequelize-cli db:migrate

      - name: Charger les données de seed
        env:
          NODE_ENV: development
        run: npx sequelize-cli db:seed:all

      - name: Exécuter la suite de tests (Jest/Supertest — SQLite en mémoire)
        # Les tests unitaires et d'intégration s'exécutent contre une base SQLite
        # en mémoire (voir tests/setup/env.js et .env.test), isolée par fichier de
        # test et sans dépendance réseau. Les étapes précédentes (migrations/seed)
        # valident indépendamment que le schéma s'applique correctement à un vrai
        # moteur MySQL.
        run: npm test -- --ci

      - name: Linter le code (ESLint)
        run: npm run lint

  frontend-build:
    name: Frontend — Build React/Vite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: gp_suite_test
          MYSQL_USER: gp_user_test
          MYSQL_PASSWORD: gp_password_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Builder l'application
        working-directory: frontend
        run: npm run build

      - name: Vérifier le rendu réel des pages publiques (smoke test SSR, état de chargement)
        working-directory: frontend
        run: npm run smoke-test

      - name: Vérifier l'intercepteur d'authentification (pas de refresh/redirection sur un échec de connexion)
        working-directory: frontend
        run: npm run smoke-test-auth

      - name: Installer les dépendances backend (pour démarrer un vrai serveur de test)
        working-directory: backend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Préparer, migrer et peupler une vraie base MySQL de test
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=gp_suite_test/' .env
          sed -i 's/^DB_USER=.*/DB_USER=gp_user_test/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=gp_password_test/' .env
          for i in {1..15}; do
            mysqladmin ping -h127.0.0.1 -P3306 -ugp_user_test -pgp_password_test && break
            sleep 3
          done
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed:all

      - name: Démarrer un vrai serveur backend pour le test frontend
        working-directory: backend
        run: |
          DB_HOST=127.0.0.1 DB_NAME=gp_suite_test DB_USER=gp_user_test DB_PASSWORD=gp_password_test \
          PORT=5096 JWT_SECRET=ci_test_secret_key_minimum_32_characters \
          JWT_REFRESH_SECRET=ci_test_refresh_secret_key_32_chars NODE_ENV=production \
          nohup node src/server.js > /tmp/backend-ci.log 2>&1 &
          for i in {1..15}; do
            curl -sf http://localhost:5096/health && break
            echo "En attente du backend... ($i)"
            sleep 2
          done

      - name: Vérifier le rendu réel des pages avec de vraies données (post-chargement)
        # Complémentaire du smoke test SSR ci-dessus : celui-ci monte réellement
        # chaque page dans un DOM (jsdom), laisse le useEffect s'exécuter contre
        # un vrai backend, et vérifie le contenu APRÈS résolution des requêtes —
        # seul moyen de détecter une erreur de désimbrication de la réponse API
        # (ex. `res.data.data` vs `res.data.data.data`), invisible au rendu
        # serveur puisque useEffect ne s'y exécute jamais.
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:5096/api/v1
        run: npm run smoke-test-donnees

  docker-build:
    name: Validation des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Builder l'image backend
        run: docker build -t gp-suite-backend:ci ./backend

      - name: Builder l'image frontend
        run: docker build -t gp-suite-frontend:ci ./frontend