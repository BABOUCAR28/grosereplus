# Configuration Nginx — GP-SUITE — grosereplus.com
# Reverse proxy vers le frontend (React) et le backend (API Node.js)

# ── Compression Gzip ──────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

upstream backend_api {
    server backend:5000;
}

upstream frontend_app {
    server frontend:80;
}

# ── HTTP : redirection HTTPS + défi ACME Let's Encrypt ────────
server {
    listen 80;
    server_name grosereplus.com www.grosereplus.com;

    # Requis par Certbot pour valider/renouveler le certificat
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex (HTTPS) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.grosereplus.com;

    ssl_certificate     /etc/nginx/ssl/live/grosereplus.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/grosereplus.com/privkey.pem;

    return 301 https://grosereplus.com$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name grosereplus.com;

    ssl_certificate     /etc/nginx/ssl/live/grosereplus.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/grosereplus.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off; # désactivé pour la confidentialité persistante

    # ── En-têtes de sécurité ───────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options       "nosniff"                             always;
    add_header X-XSS-Protection             "1; mode=block"                       always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;

    # ── Content-Security-Policy ────────────────────────────────
    # Autorise : même origine, Google Fonts, données inline pour React.
    # Ajuster si vous chargez des scripts/styles depuis d'autres CDN.
    add_header Content-Security-Policy
      "default-src 'self';
       script-src  'self' 'unsafe-inline';
       style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
       font-src    'self' https://fonts.gstatic.com;
       img-src     'self' data: blob:;
       connect-src 'self' https://grosereplus.com;
       frame-ancestors 'none';"
      always;

    client_max_body_size 25M;

    # ── API Back-End ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Documentation Swagger ──────────────────────────────────
    location /api-docs/ {
        proxy_pass       http://backend_api;
        proxy_set_header Host $host;
    }

    # ── Fichiers uploadés (logo, brochure, photos admin) ──────
    location /uploads/ {
        proxy_pass       http://backend_api;
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # ── Frontend React (SPA) ───────────────────────────────────
    location / {
        proxy_pass       http://frontend_app;
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
    }
}